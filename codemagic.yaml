workflows:
  android-apk:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.44.2
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.findy.drivePressure
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign --verbose > /tmp/flutter_build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=== BUILD FAILED - last 200 lines ==="
            tail -200 /tmp/flutter_build.log
          fi
          exit $STATUS
      - name: Build signed IPA
        script: |
          set -eo pipefail
          xcodebuild clean \
            -workspace "ios/Runner.xcworkspace" \
            -scheme "Runner" \
            -configuration Release
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        apple_id: $APPLE_ID
        password: $APP_SPECIFIC_PASSWORD
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true
