workflows:
  android-apk:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.44.2
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.findy.drivePressure
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS (no codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign --verbose 2>&1 | tail -100
      - name: Build signed IPA
        script: |
          set -e
          echo "=== Signing identities (all keychains) ==="
          security find-identity -v -p codesigning || true
          echo "=== Provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ | head -10 || true
          echo "=== Entitlements file ==="
          cat ios/Runner/Runner.entitlements || true
          echo "=== Build settings after use-profiles ==="
          xcodebuild -workspace "ios/Runner.xcworkspace" -scheme "Runner" \
            -configuration Release \
            -showBuildSettings 2>&1 | grep -iE "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING|ENTITLEMENT" || true
          echo "=== Building IPA ==="
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --verbose
      - name: Upload to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Found IPA: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true
