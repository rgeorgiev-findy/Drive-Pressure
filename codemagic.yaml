workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.findy.drivePressure
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Build signed IPA
        script: flutter build ipa --release
      - name: Upload to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --verbose
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true
