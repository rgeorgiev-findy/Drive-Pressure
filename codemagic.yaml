workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.findy.drivePressure
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release
      - name: Export IPA from archive
        script: |
          ARCHIVE=$(find ~ -name "*.xcarchive" 2>/dev/null | head -1)
          echo "Archive: $ARCHIVE"
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath /tmp/ipa_export \
            -exportOptionsPlist /tmp/ExportOptions.plist
      - name: Upload to TestFlight
        script: |
          IPA=$(find /tmp/ipa_export -name "*.ipa" | head -1)
          echo "Found IPA: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --verbose
    artifacts:
      - "**/*.ipa"
    publishing:
      email:
        recipients:
          - rgeorgiev@findy.eu
        notify:
          success: true
          failure: true
